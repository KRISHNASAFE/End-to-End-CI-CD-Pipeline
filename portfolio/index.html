<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Portfolio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    h1{
      font-size:4rem;
      color:#38bdf8;
    }

    p{
      margin-top:20px;
      font-size:1.2rem;
      width:60%;
      line-height:1.8;
    }

    .skills{
      margin-top:30px;
    }

    .skills span{
      background:#1e293b;
      padding:10px 20px;
      margin:10px;
      display:inline-block;
      border-radius:8px;
    }

    .btn{
      margin-top:40px;
      padding:15px 30px;
      border:none;
      background:#38bdf8;
      color:black;
      font-size:1rem;
      cursor:pointer;
      border-radius:10px;
      transition:0.3s;
    }

    .btn:hover{
      background:white;
    }
  </style>
</head>

<body>

<header>

  <h2>Hi, I'm Chirag Gujarathi</h2>

  <p>
    DevOps Engineer passionate about Kubernetes, CI/CD,
    Docker, Cloud Infrastructure, Security and Automation.
  </p>

  <div class="skills">
    <span>Docker</span>
    <span>Kubernetes</span>
    <span>Jenkins</span>
    <span>AWS</span>
    <span>Terraform</span>
    <span>Linux</span>
    <span>GitHub Actions</span>
  </div>

  <button class="btn">
    View Projects
  </button>

</header>

</body>
</html>
